@if (loading()) {
  <div class="spinner-wrap">
    <p-progressSpinner />
  </div>
} @else {
  <div class="directions-page">
    @if (bachelor().length > 0) {
      <h2>Бакалавриат</h2>
      <app-direction-card-list [directions]="bachelor()" (selected)="open($event)" />
    }

    @if (master().length > 0) {
      <h2>Магистратура</h2>
      <app-direction-card-list [directions]="master()" (selected)="open($event)" />
    }
  </div>
}
