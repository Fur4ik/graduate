@if (loading()) {
  <div class="spinner-wrap">
    <p-progressSpinner />
  </div>
} @else {
  <div class="directions-page">
    <h1>Направления</h1>
    <div class="directions-grid">
      @for (table of tables(); track table) {
        <p-card [header]="table" class="direction-card">
          <ng-template #footer>
            <div class="card-footer">
              <p-button label="Открыть" icon="pi pi-arrow-right" (onClick)="open(table)" />
            </div>
          </ng-template>
        </p-card>
      }
    </div>
  </div>
}
