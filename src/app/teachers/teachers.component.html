<div class="teachers-page">
  <p-table
    #dt
    [value]="teachers()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['name', 'email']"
    styleClass="p-datatable-striped"
  >
    <ng-template #caption>
      <div class="table-header">
        <h2>Преподаватели</h2>
        <div class="search-wrap">
          <p-iconfield>
            <p-inputicon styleClass="pi pi-search" />
            <input
              pInputText
              type="text"
              placeholder="Поиск..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
          </p-iconfield>
        </div>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="id" style="width: 80px"># <p-sortIcon field="id" /></th>
        <th pSortableColumn="name">Преподаватель <p-sortIcon field="name" /></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-teacher>
      <tr>
        <td>{{ teacher.id }}</td>
        <td>{{ teacher.name }}</td>
        <td>
          @if (teacher.email) {
            <a [href]="'mailto:' + teacher.email">{{ teacher.email }}</a>
          } @else {
            <span class="no-email">—</span>
          }
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" style="text-align: center; padding: 24px">Данные не найдены</td>
      </tr>
    </ng-template>
  </p-table>
</div>
