@if (loading()) {
  <div class="flex justify-center mt-10">
    <p-progressSpinner />
  </div>
} @else {
  <div class="p-6">
    <h1 class="text-2xl font-bold mb-6">Направления</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (table of tables(); track table) {
        <p-card [header]="table" styleClass="cursor-pointer hover:shadow-lg transition-shadow">
          <ng-template #footer>
            <p-button label="Открыть" icon="pi pi-arrow-right" (onClick)="open(table)" />
          </ng-template>
        </p-card>
      }
    </div>
  </div>
}
